name: jarvis

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-jarvis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jarvis_dev_password}
      POSTGRES_DB: ${DB_NAME:-jarvis}
    # Host port 5433, not 5432: this machine already has a native Windows
    # Postgres service bound to 5432, which silently wins that port on the
    # host network stack and shadows the container - not something to touch.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jarvis} -d ${DB_NAME:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
